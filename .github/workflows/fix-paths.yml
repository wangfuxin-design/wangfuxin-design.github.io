name: Fix image paths

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite asset paths to repo root
        run: |
          set -e
          sed -i 's|assets/work/||g' index.html
          echo "remaining refs:"
          grep -c 'assets/work' index.html || true

      - name: Commit fixed index.html
        run: |
          set -e
          git config user.name "wangfuxin-design"
          git config user.email "wangfuxin-design@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix image paths to repo root"
            git push
          fi
