name: Unzip portfolio parts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip all parts into place
        run: |
          set -e
          for z in 00-index.zip assets-part-*.zip; do
            [ -e "$z" ] || continue
            echo "Extracting $z"
            unzip -o "$z" -d .
          done
          rm -f 00-index.zip assets-part-*.zip
          echo "--- final tree (top level) ---"
          ls -la

      - name: Commit extracted files
        run: |
          set -e
          git config user.name "wangfuxin-design"
          git config user.email "wangfuxin-design@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Extract portfolio files"
            git push
          fi
